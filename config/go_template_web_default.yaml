# description: configuration file path, if it's specified as relative path,
# then directory of binary file will be the base directory of configuration file,
# it is recommended to specify absolute path.
# command-line-argument: --config
# type: string
# default: None
config: go_template_web.yaml

# description: specify whether go-template-web runs as daemon mode, if true, it will run as a daemon process.
# command-line-argument: --daemon
# type: bool
# default: false
daemon: false

# log configuration
log:
  # description: log file path, if it's specified as relative path,
  # then directory of binary file will be the base directory of log file,
  # it is recommended to specify absolute path.
  # command-line-argument: --log-file
  # type: string
  # default: log/run.log
  fileName: log/run.log
  # description: log level
  # command-line-argument: --log-level
  # type: string
  # available: [debug, info, warn, error, fatal]
  # default: info
  level: info
  # description: log format
  # command-line-argument: --log-format
  # type: string
  # available: [text, json]
  # default: text
  format: text
  # description: log file max size
  # command-line-argument: --log-max-size
  # unit: MB
  # type: int
  # default: 100
  maxSize: 100
  # description: specify how many days the log file will be kept after rotating,
  # older than max-days files will be removed automatically.
  # command-line-argument: --log-max-days
  # type: int
  # default: 7
  maxDays: 7
  # description: specify how many files will be kept after rotating,
  # the oldest log files will be removed automatically.
  # command-line-argument: --log-max-backups
  # type: int
  # default: 5
  maxBackups: 5
  # description: specify if rotating the log file on starting up
  # command-line-argument: --log-rotate-on-startup
  # type: bool
  # default: false
  rotateOnStartup: false
  # description: specify if logging the message to the stdout as well
  # if no, log message will only be logged to the log file,
  # if yes, log message will be logged to the log file and stdout.
  # command-line-argument: --log-stdout
  # type: bool
  # default: false
  stdout: false

# server configuration
server:
  # description: specify the server listening address, format: host:port
  # command-line-argument: --server-addr
  # type: string
  # default: 0.0.0.0:80
  addr: "0.0.0.0:80"
  # description: pid file path, if it's specified as relative path,
  # then directory of binary file will be the base directory of log file,
  # it is recommended to specify absolute path.
  # command-line-argument: --server-pid-file
  # type: string
  # default: go_template_web.pid
  pidFile: go_template_web.pid
  # description: specify the read timeout of http request, 0 means no timeout
  # command-line-argument: --server-read-timeout
  # unit: second
  # type: int
  # available: 0 - 3600
  # default: 5
  readTimeout: 5
  # description: specify the write timeout of http resp, 0 means no timeout
  # command-line-argument: --server-write-timeout
  # unit: second
  # type: int
  # available: 1 - 3600
  # default: 10
  writeTimeout: 10
  # description: pprof configuration
  pprof:
    # description: specify if enable the pprof
    # command-line-argument: --server-pprof-enabled
    # type: bool
    # default: false
    enabled: false
  # router configuration
  router:
    # description: specify the alternative base path, this base path will not impact the original api path,
    # but adds additional api paths with specified base path
    # command-line-argument: --server-router-alternative-base-path
    # type: string
    # default: ""
    alternativeBasePath: ""
    # description: specify the real body path of the json body of the http request
    # command-line-argument: --server-router-alternative-body-path
    # type: string
    # default: ""
    alternativeBodyPath: ""
    # description: specify the http return code when the server encountered an error
    # command-line-argument: --server-router-http-error-code
    # type: int
    # available: [200, 500]
    # default: 500
    httpErrorCode: 500

# db configuration
db:
  # mysql configuration
  mysql:
    # description: database address, format: host:port
    # command-line-argument: --db-mysql-addr
    # type: string
    # default: 127.0.0.1:3306
    addr: "127.0.0.1:3306"
    # description: database name
    # command-line-argument: --db-mysql-name
    # type: string
    # default: go_template_web
    name: go_template_web
    # description: database username
    # command-line-argument: --db-mysql-user
    # type: string
    # default: root
    user: root
    # description: database password, note that the password should be encrypted by the sm gtw key.
    # command-line-argument: --db-mysql-pass
    # type: string
    # default: ""
    pass: ""
  # redis configuration
  redis:
    # description: redis addresses, format: host:port,host:port, if empty, redis will be disabled
    # command-line-argument: --db-redis-addrs
    # type: list
    # default: ""
    addrs: ""
    # description: redis user, if ACL is enabled
    # command-line-argument: --db-redis-user
    # type: string
    # default: default
    user: default
    # description: redis password, note that the password should be encrypted by the sm gtw key.
    # command-line-argument: --db-redis-pass
    # type: string
    # default: ""
    pass: ""
  # connection pool configuration, shared by mysql and redis
  pool:
    # description: specify the max connections of the pool
    # command-line-argument: --db-pool-max-connections
    # type: int
    # available: 1 - max int
    # default: 20
    maxConnections: 20
    # description: specify the initial connections of the pool
    # command-line-argument: --db-pool-init-connections
    # type: int
    # available: 1 - max int
    # default: 5
    initConnections: 5
    # description: specify the max idle connections of the pool
    # command-line-argument: --db-pool-max-idle-connections
    # type: int
    # available: 1 - max int
    # default: 10
    maxIdleConnections: 10
    # description: specify the max idle time of the pool connections
    # command-line-argument: --db-pool-max-idle-time
    # unit: second
    # type: int
    # available: 1 - max int
    # default: 1800
    maxIdleTime: 1800
    # description: specify the max wait time when getting a connection from the pool, -1 means no limit
    # command-line-argument: --db-pool-max-wait-time
    # unit: second
    # type: int
    # available: -1 - max int
    # default: 1
    maxWaitTime: 1
    # description: specify the max retry count when executing sql, -1 means no retry
    # command-line-argument: --db-pool-max-retry-count
    # type: int
    # available: -1 - max int
    # default: -1
    maxRetryCount: -1
    # description: specify the keep alive interval of the pool connections
    # command-line-argument: --db-pool-keep-alive-interval
    # unit: second
    # type: int
    # available: 1 - max int
    # default: 300
    keepAliveInterval: 300

# auth configuration
auth:
  # description: specify if enable the request signature authentication,
  # if true, every api request except health check endpoints (/api/v1/health/*)
  # must carry valid X-Client-Id and X-Sign headers, see the signature algorithm in docs.
  # note that db.mysql and db.redis are required when enabled,
  # client secrets are stored in t_sys_secret_info and the nonce store lives in redis.
  # type: bool
  # default: false
  enabled: false
  # description: specify the allowed clock skew between client timestamp and server time,
  # requests with timestamp outside the window will be rejected.
  # unit: second
  # type: int
  # available: 1 - 3600
  # default: 300
  timestampWindow: 300
  # description: specify the ttl of the cached client secrets in redis,
  # the ttl is refreshed on every cache hit,
  # a cron job registered in newJobByName may reload secrets from t_sys_secret_info periodically.
  # command-line-argument: --auth-secret-ttl
  # unit: second
  # type: int
  # available: 1 - 86400
  # default: 600
  secretTTL: 600

# sm configuration
sm:
  # description: the sm2 private key hex string used to encrypt and decrypt passwords,
  # passwords in db.mysql.pass and db.redis.pass must be encrypted by this key.
  # command-line-argument: --sm-gtw-key
  # type: string
  # default: C0B4C03A2CC83DE33427A4B9504E60B52F31746FA641D89AF2B4A96A53B64446
  gtwKey: C0B4C03A2CC83DE33427A4B9504E60B52F31746FA641D89AF2B4A96A53B64446