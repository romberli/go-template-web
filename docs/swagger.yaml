info:
  contact: {}
paths:
  /api/v1/cron/run:
    post:
      consumes:
      - application/json
      parameters:
      - description: job id, takes precedence over job_name
        in: body
        name: job_id
        schema:
          type: integer
      - description: job name
        in: body
        name: job_name
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "job run completed"}'
          schema:
            type: string
      summary: run a job once immediately, does not affect the job schedule
      tags:
      - cron
  /api/v1/health/ping:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: '{"ping": "pong"}'
          schema:
            type: string
      summary: ping
      tags:
      - health
  /api/v1/health/status:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: "0"
          schema:
            type: string
      summary: check health status
      tags:
      - health
swagger: "2.0"
